<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Face Sensor — FaceToModel</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      --font-mono: "SF Mono", Menlo, Monaco, monospace;
      --sys-blue: #0a84ff;
      --sys-green: #30d158;
      --sys-red: #ff453a;
      --sys-gray: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: var(--font-sans);
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Video Câmera Frontal */
    #webcam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    /* Face Framing Reticle Apple Style */
    .face-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 180px;
      border: 1.5px dashed rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform, left, top, width, height;
    }
    .face-reticle.active {
      border: 2px solid var(--sys-green);
      box-shadow: 0 0 20px rgba(48, 209, 88, 0.35), inset 0 0 12px rgba(48, 209, 88, 0.15);
    }

    /* Top HUD Apple Style */
    .top-hud {
      position: relative;
      z-index: 10;
      padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }

    .pill-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background: rgba(28, 28, 30, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sys-gray);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .pill-dot.connected {
      background: var(--sys-green);
      box-shadow: 0 0 8px var(--sys-green);
    }
    .pill-dot.error {
      background: var(--sys-red);
    }

    /* Bottom HUD */
    .bottom-hud {
      position: relative;
      z-index: 10;
      padding: 16px 20px calc(env(safe-area-inset-bottom) + 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 40%, transparent);
    }

    .status-text {
      font-size: 13px;
      color: rgba(235, 235, 245, 0.75);
      font-weight: 500;
    }

    /* Loader Modal */
    #loader-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 30px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--sys-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="viewport">
  <video id="webcam" autoplay playsinline muted></video>

  <!-- Top Status -->
  <div class="top-hud">
    <div class="pill-badge">
      <div class="pill-dot" id="p2p-dot"></div>
      <span id="p2p-label">Conectando...</span>
    </div>
    
    <div class="pill-badge" style="font-family: var(--font-mono); font-size: 11px;">
      <span id="fps-label">60 FPS</span>
    </div>
  </div>

  <!-- Face Reticle Guide -->
  <div class="face-reticle" id="face-reticle"></div>

  <!-- Bottom Info -->
  <div class="bottom-hud">
    <span class="status-text" id="face-tracking-status">Rosto detectado: Aguardando...</span>
  </div>
</div>

<!-- Loader Inicial -->
<div id="loader-overlay">
  <div class="spinner"></div>
  <h2 style="font-size: 19px; font-weight: 600;" id="loader-title">Iniciando Sensor Facial...</h2>
  <p style="font-size: 13px; color: rgba(235,235,245,0.6);" id="loader-sub">Aguardando autorização da câmera</p>
</div>

<script type="module">
  import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  import { P2PClient } from '/js/p2p-client.js';

  // Obter Sala a partir do Hash (ex: /camera.html#room=xyz)
  const roomHash = window.location.hash ? window.location.hash.replace('#room=', '').replace('#', '') : 'default-room';
  
  const video = document.getElementById('webcam');
  const loaderOverlay = document.getElementById('loader-overlay');
  const loaderTitle = document.getElementById('loader-title');
  const loaderSub = document.getElementById('loader-sub');
  const p2pDot = document.getElementById('p2p-dot');
  const p2pLabel = document.getElementById('p2p-label');
  const fpsLabel = document.getElementById('fps-label');
  const faceTrackingStatus = document.getElementById('face-tracking-status');
  const faceReticle = document.getElementById('face-reticle');

  let faceLandmarker = null;
  let p2pClient = null;
  let lastVideoTime = -1;
  let frameCount = 0;
  let lastFpsTime = performance.now();
  let wakeLock = null;

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('[Camera] Screen Wake Lock ativo');
      }
    } catch (err) {
      console.warn('[Camera] Wake Lock não disponível:', err);
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });

  async function bootstrap() {
    try {
      // 0. Screen Wake Lock
      await requestWakeLock();

      // 1. Inicializar P2P
      p2pClient = new P2PClient(roomHash, false);
      p2pClient.onPeerJoinCallback = () => {
        p2pDot.className = 'pill-dot connected';
        p2pLabel.textContent = 'Conectado ✓';
      };
      p2pClient.onPeerLeaveCallback = () => {
        p2pDot.className = 'pill-dot';
        p2pLabel.textContent = 'Desconectado';
      };
      p2pClient.connect();

      // 2. Iniciar Câmera
      loaderTitle.textContent = 'Acessando Câmera...';
      loaderSub.textContent = 'Toque em Permitir no Safari';
      const camStream = await setupCamera();
      if (p2pClient && camStream) {
        p2pClient.sendStream(camStream);
      }

      // 3. Inicializar MediaPipe
      loaderTitle.textContent = 'Carregando IA Facial...';
      loaderSub.textContent = 'Preparando rede neural';
      await initMediaPipe();

      loaderOverlay.style.display = 'none';
      requestAnimationFrame(predictLoop);

    } catch (err) {
      console.error('Falha de inicialização:', err);
      let detailMsg = err.message || String(err);
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        detailMsg = 'Permissão da câmera negada. Vá em Ajustes > Safari > Câmera > Permitir e recarregue a página.';
      }
      loaderOverlay.innerHTML = `
        <h2 style="font-size: 18px; color: var(--sys-red); font-weight: 600;">Erro ao Inicializar</h2>
        <p style="font-size: 13px; color: rgba(235,235,245,0.7); margin: 10px 0 20px; line-height: 1.4; max-width: 280px; text-align: center;">${detailMsg}</p>
        <button id="btn-retry-init" style="padding: 12px 24px; background: var(--sys-blue); color:#fff; border:none; border-radius:12px; font-weight:600; font-size:15px; cursor:pointer;-webkit-appearance:none;">Tentar Novamente</button>
      `;
      const btn = document.getElementById('btn-retry-init');
      if (btn) {
        btn.addEventListener('click', () => {
          window.location.href = window.location.href;
        });
      }
    }
  }

  async function setupCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } },
      audio: false
    });
    video.srcObject = stream;
    return new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        resolve(stream);
      };
    });
  }

  async function initMediaPipe() {
    const filesetResolver = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );

    try {
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        outputFaceBlendshapes: true,
        outputFacialTransformationMatrixes: true,
        runningMode: 'VIDEO',
        numFaces: 1
      });
    } catch (gpuErr) {
      console.warn('Fallback para CPU delegate:', gpuErr);
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'CPU'
        },
        outputFaceBlendshapes: true,
        outputFacialTransformationMatrixes: true,
        runningMode: 'VIDEO',
        numFaces: 1
      });
    }
  }

  // Smooth Reticle Tracking EMA
  let smoothBox = { x: 50, y: 50, w: 35, h: 45 };

  function predictLoop() {
    if (video.currentTime !== lastVideoTime && faceLandmarker && video.readyState >= 2) {
      lastVideoTime = video.currentTime;
      const results = faceLandmarker.detectForVideo(video, performance.now());

      if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
        faceTrackingStatus.textContent = 'Rastreamento: Ativo ✓';
        faceTrackingStatus.style.color = 'var(--sys-green)';
        if (faceReticle) faceReticle.classList.add('active');

        // Bounding box dinâmico a partir dos landmarks faciais
        if (results.faceLandmarks && results.faceLandmarks.length > 0 && faceReticle) {
          const landmarks = results.faceLandmarks[0];
          let minX = 1, maxX = 0, minY = 1, maxY = 0;
          for (let i = 0; i < landmarks.length; i++) {
            const lm = landmarks[i];
            if (lm.x < minX) minX = lm.x;
            if (lm.x > maxX) maxX = lm.x;
            if (lm.y < minY) minY = lm.y;
            if (lm.y > maxY) maxY = lm.y;
          }

          // Inverter X pois o vídeo está espelhado com scaleX(-1)
          const targetCenterX = (1 - (minX + maxX) / 2) * 100;
          const targetCenterY = ((minY + maxY) / 2) * 100;
          const targetWidth = Math.max(18, Math.min(65, (maxX - minX) * 125));
          const targetHeight = Math.max(22, Math.min(80, (maxY - minY) * 130));

          // Suavização EMA
          smoothBox.x += (targetCenterX - smoothBox.x) * 0.35;
          smoothBox.y += (targetCenterY - smoothBox.y) * 0.35;
          smoothBox.w += (targetWidth - smoothBox.w) * 0.35;
          smoothBox.h += (targetHeight - smoothBox.h) * 0.35;

          faceReticle.style.left = `${smoothBox.x}%`;
          faceReticle.style.top = `${smoothBox.y}%`;
          faceReticle.style.width = `${smoothBox.w}vw`;
          faceReticle.style.height = `${smoothBox.h}vh`;
        }

        const blendShapesMap = {};
        for (const shape of results.faceBlendshapes[0].categories) {
          blendShapesMap[shape.categoryName] = shape.score;
        }

        // Extrair Rotação 3DoF da Cabeça (Pitch, Yaw, Roll)
        let rotation = null;
        if (results.facialTransformationMatrixes && results.facialTransformationMatrixes.length > 0) {
          const m = results.facialTransformationMatrixes[0].data;
          const pitch = Math.atan2(m[6], m[10]);
          const yaw   = Math.atan2(-m[2], Math.sqrt(m[6] * m[6] + m[10] * m[10]));
          const roll  = Math.atan2(m[1], m[0]);
          rotation = { pitch: -pitch * 0.75, yaw: yaw * 0.75, roll: -roll * 0.75 };
        }

        // Transmissão P2P instantânea para o Mac
        p2pClient.sendBlendshapes({
          blendShapes: blendShapesMap,
          rotation: rotation
        });
      } else {
        faceTrackingStatus.textContent = 'Aponte o rosto para a câmera';
        faceTrackingStatus.style.color = 'rgba(235,235,245,0.6)';
        if (faceReticle) {
          faceReticle.classList.remove('active');
          // Retornar suavemente ao centro
          smoothBox.x += (50 - smoothBox.x) * 0.1;
          smoothBox.y += (50 - smoothBox.y) * 0.1;
          faceReticle.style.left = `${smoothBox.x}%`;
          faceReticle.style.top = `${smoothBox.y}%`;
        }
      }

      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        fpsLabel.textContent = `${frameCount} FPS`;
        frameCount = 0;
        lastFpsTime = now;
      }
    }

    requestAnimationFrame(predictLoop);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
</script>
</body>
</html>
